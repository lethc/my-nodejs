<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar usuario</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <main class="card">
        <h1>Registrar usuario</h1>

        <!-- El envío lo intercepta js/registro.js, que llama a POST /auth/register -->
        <form id="formRegistro">
            <label for="email">Correo</label>
            <input type="email" id="email" required autocomplete="username">

            <!-- minlength es solo una ayuda visual: el servidor aún no valida la longitud -->
            <label for="password">Contraseña</label>
            <input type="password" id="password" required minlength="8" autocomplete="new-password">

            <label for="confirmar">Confirmar contraseña</label>
            <input type="password" id="confirmar" required minlength="8" autocomplete="new-password">

            <button type="submit" id="btnRegistrar">Registrar</button>
        </form>

        <!-- Aquí se muestran los errores o el aviso de éxito -->
        <p class="mensaje" id="mensaje"></p>

        <p class="enlace">¿Ya tienes cuenta? <a href="/login.html">Inicia sesión</a></p>
    </main>

    <script src="/js/registro.js"></script>
</body>
</html>
